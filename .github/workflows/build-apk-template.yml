name: Build and publish APK template

on:
  push:
    branches:
      - fix/apk-template-fullscreen-2-3-0
    paths:
      - "catroid/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk-template.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-template-2-2-0-r1
  cancel-in-progress: false

jobs:
  build-template:
    name: Build APK template 2.2.0-r1
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Xmx5g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build the APK template
        run: |
          chmod +x ./gradlew
          ./gradlew :catroid:assembleApktemplateTemplateRelease --no-daemon --stacktrace -x lint -x test

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find catroid/build/outputs/apk -type f -name '*.apk' | grep -i 'apktemplate' | head -n 1 || true)"
          if [ -z "$APK_PATH" ]; then
            echo "APK template output was not found."
            find catroid/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/NewCatroid_APKTemplate_2-2-0r1.apk"
          test -s "dist/NewCatroid_APKTemplate_2-2-0r1.apk"
          ls -lh "dist/NewCatroid_APKTemplate_2-2-0r1.apk"

      - name: Publish template Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.2.0-r1
          target_commitish: ${{ github.sha }}
          name: NewCatroid APK Template 2.2.0-r1
          body: |
            Maintenance release of the NewCatroid APK template.

            Includes the exported-stage immersive focus handling and the display-cutout
            resource patcher. APK generation and physical-device behavior still require
            validation on the target device.
          files: dist/NewCatroid_APKTemplate_2-2-0r1.apk
          fail_on_unmatched_files: true
